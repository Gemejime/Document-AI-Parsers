name: Publish Production Container Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom tag for container images (defaults to branch/sha if empty)"
        required: false
        default: ""
      worker:
        description: "Worker image to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - vision
          - audio

permissions:
  contents: read

jobs:
  determine-matrix:
    name: Determine Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          WORKER="${{ github.event.inputs.worker || 'all' }}"
          if [ "$WORKER" = "vision" ]; then
            echo 'matrix={"include":[{"name":"vision","dockerfile":"deployments/docker/Dockerfile.vision","image":"doc-ai-vision-worker"}]}' >> $GITHUB_OUTPUT
          elif [ "$WORKER" = "audio" ]; then
            echo 'matrix={"include":[{"name":"audio","dockerfile":"deployments/docker/Dockerfile.audio","image":"doc-ai-audio-worker"}]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"include":[{"name":"vision","dockerfile":"deployments/docker/Dockerfile.vision","image":"doc-ai-vision-worker"},{"name":"audio","dockerfile":"deployments/docker/Dockerfile.audio","image":"doc-ai-audio-worker"}]}' >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build & Publish ${{ matrix.image }}
    needs: determine-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Build and Push Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-gitops-helm:
    name: Sync GitOps Helm Image Tags
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Chart & Values Image Tags
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          WORKER="${{ github.event.inputs.worker || 'all' }}"
          echo "Updating Helm chart appVersion and values tags to ${VERSION} for worker=${WORKER}..."
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deployments/helm/Chart.yaml
          if [ "$WORKER" = "vision" ] || [ "$WORKER" = "all" ]; then
            sed -i -E '/^image:/,/^[a-zA-Z]/ s/^([[:space:]]+)tag:[[:space:]].*/\1tag: "'"${VERSION}"'"/' deployments/helm/values-vision.yaml
          fi
          if [ "$WORKER" = "audio" ] || [ "$WORKER" = "all" ]; then
            sed -i -E '/^image:/,/^[a-zA-Z]/ s/^([[:space:]]+)tag:[[:space:]].*/\1tag: "'"${VERSION}"'"/' deployments/helm/values-audio.yaml
          fi

      - name: Commit and Push GitOps Tag Sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/helm/Chart.yaml deployments/helm/values-vision.yaml deployments/helm/values-audio.yaml
          git commit -m "chore(gitops): sync Helm values image tags to release ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push origin HEAD:main

