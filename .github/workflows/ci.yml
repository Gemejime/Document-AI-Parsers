name: CI - Quality Gates & Verification

on:
  push:
    branches:
      - main
      - rag-document-ai-worker
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - rag-document-ai-worker
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run Ruff Formatting Check
        run: python -m ruff format --check .

  typecheck:
    name: Mypy Strict Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Mypy Type Verification
        run: python -m mypy cmd internal test

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest test/unit test/integration \
            --cov=internal \
            --cov=cmd \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  proto-check:
    name: Protobuf Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Protobuf Compiler Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install grpcio-tools protobuf

      - name: Validate Protobuf Definitions
        run: |
          python -m grpc_tools.protoc \
            -I. \
            --descriptor_set_out=/dev/null \
            api/proto/v1/common.proto \
            api/proto/v1/document_ai.proto

  helm-lint:
    name: Helm Values & Manifests Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python for YAML Verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Lint Helm Values YAML Files
        run: |
          yamllint -c .yamllint.yaml deployments/helm/

      - name: Lint Rendered Helm Manifests
        run: |
          helm template test-vision deployments/helm -f deployments/helm/values-vision.yaml | yamllint -d "{extends: relaxed, rules: {line-length: disable, octal-values: disable}}" -
          helm template test-audio deployments/helm -f deployments/helm/values-audio.yaml | yamllint -d "{extends: relaxed, rules: {line-length: disable, octal-values: disable}}" -

  secret-scan:
    name: Secured Credential & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke-build:
    name: Dockerfile Build Verification (${{ matrix.worker }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: vision
            dockerfile: deployments/docker/Dockerfile.vision
          - worker: audio
            dockerfile: deployments/docker/Dockerfile.audio
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke Build Dockerfile (Builder Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: builder
          push: false
          tags: ${{ matrix.worker }}-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
