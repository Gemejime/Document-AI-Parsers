name: CI - RAG Document AI Worker

on:
  push:
    branches: [main, master, "develop*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ----------------------------------------------------------------------------
  # 1. Code Quality & Static Analysis
  # ----------------------------------------------------------------------------
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: |
          ruff check . --output-format=github

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check .

      - name: Run Static Type Checker (mypy)
        run: |
          if [ -d "cmd" ] || [ -d "internal" ]; then
            mypy --ignore-missing-imports cmd internal test || true
          else
            echo "Source directories not initialized yet, skipping mypy."
          fi

  # ----------------------------------------------------------------------------
  # 2. Protocol Buffer Schema Validation (gRPC / Protobuf v3)
  # ----------------------------------------------------------------------------
  proto-lint:
    name: Proto Linting & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.30.0"

      - name: Lint Protocol Buffers
        run: |
          if [ -d "api/proto" ]; then
            buf lint api/proto || true
          else
            echo "Proto directory not present yet, skipping buf lint."
          fi

  # ----------------------------------------------------------------------------
  # 3. Unit & Integration Testing
  # ----------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then
            pip install .[test] || pip install pytest pytest-cov pytest-asyncio
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio
          else
            pip install pytest pytest-cov pytest-asyncio
          fi

      - name: Run Pytest Suite
        run: |
          if [ -d "test" ]; then
            pytest test/unit test/integration \
              --maxfail=5 \
              --durations=10 \
              --cov=internal \
              --cov-report=xml \
              --cov-report=term-missing || true
          else
            echo "Test directory not yet initialized, skipping pytest run."
          fi

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # 4. Kubernetes Helm & KEDA Manifest Verification
  # ----------------------------------------------------------------------------
  helm-lint:
    name: Helm & KEDA Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm Charts
        run: |
          if [ -d "deployments/helm" ]; then
            helm lint deployments/helm/* || true
          else
            echo "Deployments/helm directory not yet present, skipping helm lint."
          fi

  # ----------------------------------------------------------------------------
  # 5. Decoupled Container Build & Security Smoke Test
  # ----------------------------------------------------------------------------
  docker-smoke-build:
    name: Docker Build Validation (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: doc-ai-vision-worker
            dockerfile: deployments/docker/Dockerfile.vision
          - worker: doc-ai-audio-worker
            dockerfile: deployments/docker/Dockerfile.audio
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile Existence
        id: check-dockerfile
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile ${{ matrix.dockerfile }} not yet present, skipping build verification."
          fi

      - name: Build Worker Image (Dry Run / Cache Test)
        if: steps:check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.worker }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
