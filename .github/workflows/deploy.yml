name: Deploy - RAG Document AI Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - "deployments/**"
      - "internal/**"
      - "api/**"
      - "cmd/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".env.prod"
  workflow_run:
    workflows: ["Publish Production Container Images"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-to-kubernetes:
    name: Kubernetes Deploy & CI/CD Secret Injection
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Ensure Kubernetes Namespace Exists
        run: |
          kubectl create namespace doc-ai --dry-run=client -o yaml | kubectl apply -f -

      - name: "Inject Microservice Secrets (CI/CD Secret Injection)"
        env:
          PROD_HF_TOKEN: ${{ secrets.PROD_HF_TOKEN }}
          PROD_AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          PROD_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Validating required runtime secrets for doc-ai..."
          if [ -z "$PROD_HF_TOKEN" ] || [ -z "$PROD_AWS_ACCESS_KEY_ID" ] || [ -z "$PROD_AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing required secret(s). PROD_HF_TOKEN, PROD_AWS_ACCESS_KEY_ID, and PROD_AWS_SECRET_ACCESS_KEY must all be configured."
            exit 1
          fi

          echo "Injecting runtime secrets for rag-document-ai-worker into doc-ai namespace..."
          TMP_DIR=$(mktemp -d)
          chmod 700 "$TMP_DIR"
          trap 'rm -rf "$TMP_DIR"' EXIT

          printf "%s" "$PROD_HF_TOKEN" > "$TMP_DIR/HF_TOKEN"
          printf "%s" "$PROD_AWS_ACCESS_KEY_ID" > "$TMP_DIR/AWS_ACCESS_KEY_ID"
          printf "%s" "$PROD_AWS_SECRET_ACCESS_KEY" > "$TMP_DIR/AWS_SECRET_ACCESS_KEY"
          chmod 600 "$TMP_DIR"/*

          kubectl create secret generic doc-ai-secrets \
            --namespace doc-ai \
            --from-file=HF_TOKEN="$TMP_DIR/HF_TOKEN" \
            --from-file=AWS_ACCESS_KEY_ID="$TMP_DIR/AWS_ACCESS_KEY_ID" \
            --from-file=AWS_SECRET_ACCESS_KEY="$TMP_DIR/AWS_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Vision Worker Helm Release
        run: |
          echo "Deploying doc-ai-vision-worker via Helm..."
          helm upgrade --install doc-ai-vision-worker deployments/helm \
            --namespace doc-ai \
            --values deployments/helm/values.yaml \
            --values deployments/helm/values-vision.yaml \
            --set env.secretName=doc-ai-secrets

      - name: Deploy Audio Worker Helm Release
        run: |
          echo "Deploying doc-ai-audio-worker via Helm..."
          helm upgrade --install doc-ai-audio-worker deployments/helm \
            --namespace doc-ai \
            --values deployments/helm/values.yaml \
            --values deployments/helm/values-audio.yaml \
            --set env.secretName=doc-ai-secrets

      - name: Verify Vision Worker Rollout
        run: |
          echo "Verifying doc-ai-vision-worker rollout status..."
          kubectl rollout status deployment/doc-ai-vision-worker-rag-document-ai-worker \
            --namespace doc-ai \
            --timeout=300s

      - name: Verify Audio Worker Rollout
        run: |
          echo "Verifying doc-ai-audio-worker rollout status..."
          kubectl rollout status deployment/doc-ai-audio-worker-rag-document-ai-worker \
            --namespace doc-ai \
            --timeout=300s
