apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doc-ai-audio-worker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: doc-ai-audio-worker
    app.kubernetes.io/part-of: rag-document-ai
spec:
  project: default
  source:
    repoURL: https://github.com/Gemejime/Document-AI-Parsers.git
    targetRevision: HEAD
    path: deployments/helm
    helm:
      valueFiles:
        - values.yaml
        - values-audio.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: doc-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
