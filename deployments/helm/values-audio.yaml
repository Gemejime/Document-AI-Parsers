# Helm values for doc-ai-audio-worker
replicaCount: 1

workerComponent: "audio-worker"
taskQueue: "doc-ai-audio-queue"

image:
  repository: rag-document-ai-audio-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent

environment: "production"

# Load environment variables directly from Kubernetes Secrets or ConfigMaps (e.g. created via --from-env-file=.env)
envFrom: []
  # - secretRef:
  #     name: doc-ai-env
  # - configMapRef:
  #     name: doc-ai-config

env:
  ENVIRONMENT: "production"
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  AUDIO_TASK_QUEUE: "doc-ai-audio-queue"
  PROBE_PORT: "8080"
  PROBE_HOST: "0.0.0.0"
  LD_PRELOAD: "/usr/lib/libjemalloc.so"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  HF_HOME: "/models/cache/huggingface"
  TORCH_HOME: "/models/cache/torch"
  WHISPER_CACHE_DIR: "/models/cache/whisper"

resources:
  requests:
    cpu: "4000m"
    memory: "8Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "8000m"
    memory: "16Gi"
    nvidia.com/gpu: "1"

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
  - name: tmp
    emptyDir:
      sizeLimit: 4Gi
  - name: model-cache
    persistentVolumeClaim:
      claimName: doc-ai-model-weights-nvme-pvc
      readOnly: true

volumeMounts:
  - name: dshm
    mountPath: /dev/shm
  - name: tmp
    mountPath: /tmp
  - name: model-cache
    mountPath: /models/cache
    readOnly: true

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Autoscaling via KEDA on Temporal doc-ai-audio-queue depth
autoscaling:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
        metricName: "temporal_activity_schedule_to_start_seconds"
        query: 'sum(temporal_activity_schedule_to_start_seconds{task_queue="doc-ai-audio-queue"})'
        threshold: "3"

serviceMonitor:
  enabled: true
  interval: "15s"
  scrapeTimeout: "10s"

prometheusRule:
  enabled: true

