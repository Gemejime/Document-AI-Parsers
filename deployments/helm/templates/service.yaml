apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-document-ai-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-document-ai-worker.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 8080 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
      protocol: TCP
      name: http-probe
  selector:
    {{- include "rag-document-ai-worker.selectorLabels" . | nindent 4 }}
