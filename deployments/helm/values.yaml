replicaCount: 1
workerComponent: worker
taskQueue: doc-ai-queue
image:
  repository: rag-document-ai-worker
  tag: 0.1.0
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
  automountServiceAccountToken: true
environment: production
envFrom: []
env:
  ENVIRONMENT: production
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  TEMPORAL_HOST: temporal.default.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: doc-ai-prod
  VISION_TASK_QUEUE: doc-ai-vision-queue
  AUDIO_TASK_QUEUE: doc-ai-audio-queue
  HEARTBEAT_INTERVAL_SECONDS: '10.0'
  HEARTBEAT_TIMEOUT_SECONDS: '30.0'
  PROBE_HOST: 0.0.0.0
  PROBE_PORT: '8080'
  CHUNK_SERVICE_ENDPOINT: rag-chunk-lifecycle-service.default.svc.cluster.local:50051
  AWS_ENDPOINT_URL_S3: ''
  AWS_REGION: us-east-1
  MODEL_CACHE_DIR: /models/cache
  HF_HOME: /models/cache/huggingface
  TORCH_HOME: /models/cache/torch
  DOCLING_CACHE_DIR: /models/cache/docling
  WHISPER_CACHE_DIR: /models/cache/whisper
  PPOCR_HOME: /tmp/.paddleocr
  WHISPER_MODEL_SIZE: large-v3
  WHISPER_DEVICE: cuda
  WHISPER_COMPUTE_TYPE: float16
  WHISPER_BEAM_SIZE: '5'
  PYANNOTE_MODEL_ID: pyannote/speaker-diarization-3.1
  AUDIO_SAMPLE_RATE: '16000'
  AUDIO_PROGRESS_STEP_SECONDS: '30.0'
  OCR_CONFIDENCE_THRESHOLD: '0.80'
  TABLE_PARQUET_COMPRESSION: snappy
  LD_PRELOAD: /usr/lib/libjemalloc.so
  PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  VRAM_THRESHOLD_BYTES: '21474836480'
podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
resources:
  requests:
    cpu: 4000m
    memory: 8Gi
    nvidia.com/gpu: '1'
  limits:
    cpu: 8000m
    memory: 16Gi
    nvidia.com/gpu: '1'
volumes:
- name: dshm
  emptyDir:
    medium: Memory
    sizeLimit: 2Gi
- name: tmp
  emptyDir:
    sizeLimit: 4Gi
- name: model-cache
  persistentVolumeClaim:
    claimName: doc-ai-model-weights-nvme-pvc
    readOnly: true
volumeMounts:
- name: dshm
  mountPath: /dev/shm
- name: tmp
  mountPath: /tmp
- name: model-cache
  mountPath: /models/cache
  readOnly: true
persistence:
  enabled: true
  existingClaim: true
  name: doc-ai-model-weights-nvme-pvc
  accessModes:
  - ReadOnlyMany
  storageClass: gp3-nvme
  size: 100Gi
  annotations: {}
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
autoscaling:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers: []
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels: {}
prometheusRule:
  enabled: true
  additionalLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
